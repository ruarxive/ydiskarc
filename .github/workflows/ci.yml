name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest --cov=ydiskarc --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit
        run: pip-audit --strict --requirement requirements.txt --requirement requirements-dev.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 ydiskarc --max-line-length=100 --extend-ignore=E203,W503

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy ydiskarc --ignore-missing-imports

      - name: Check code formatting with black
        run: |
          pip install black
          black --check --line-length=100 ydiskarc

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy isort ruff

      - name: Run flake8
        run: flake8 ydiskarc tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Check code formatting with black
        run: black --check --line-length=100 ydiskarc tests

      - name: Check import order with isort
        run: isort --check-only --profile black --line-length 100 ydiskarc tests

      - name: Run ruff
        run: ruff check ydiskarc tests

      - name: Type check with mypy
        run: mypy ydiskarc --ignore-missing-imports
